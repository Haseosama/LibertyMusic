org.gradle.jvmargs=-Xmx6656M -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableR8.fullMode=true
kotlin.code.style=official

org.gradle.caching=true
org.gradle.configuration-cache=false
android.enableJetifier=false
android.nonTransitiveRClass=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.onlyEnableUnitTestForTheTestedBuildType=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
# NOTE: android.dependency.excludeLibraryComponentsFromConstraints was tried here as a
# perf tip, but it's itself deprecated (removed in AGP 10) and its suggested replacement
# (android.dependency.useConstraints=false) contradicts the pre-existing
# android.dependency.useConstraints=true above — reverted rather than risk changing that
# behavior.
# 'libraryVariants' deprecation warning comes from a compiled third-party plugin
# dependency (not our own code — searched the whole repo, no match), so there's
# nothing here to migrate. Silenced rather than acted on. Same for the
# "enable excludeLibraryComponentsFromConstraints for perf" notice — its own
# suppression property, not the (deprecated, behavior-changing) option itself.
android.sync.suppressAgpWarnings=DEPRECATED_DSL,CANNOT_BUILD_SELECTED_TARGET_ABI,LIBRARY_CONSTRAINTS_SHOULD_BE_DISABLED,UNSUPPORTED_PROJECT_OPTION_USE
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
